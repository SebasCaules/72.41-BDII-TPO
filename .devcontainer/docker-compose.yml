services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.12
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DB: farmared
      REDIS_URL: redis://redis:6379
      REDIS_DB: "0"
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
  mongo:
    image: mongo:8.3.13
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) } for (let i = 0; i < 40 && !db.hello().isWritablePrimary; i++) sleep(250); quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    volumes:
      - mongo-data:/data/db
  redis:
    image: redis:8.10.3
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
volumes:
  mongo-data:
  redis-data:
