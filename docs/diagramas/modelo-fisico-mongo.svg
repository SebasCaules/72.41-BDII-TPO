<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1318" viewBox="0 0 1340 1318">
  <title>Modelo físico en MongoDB</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b3a"/>
    </marker>
  </defs>
  <style>
    text { font-family: sans-serif; }
    .fondo { fill: #ffffff; }
    .caja { fill: #f5f8fc; stroke: #2b4c7e; stroke-width: 2; }
    .borde { fill: none; stroke: #2b4c7e; stroke-width: 2; }
    .cab { fill: #2b4c7e; }
    .tit { font-size: 21px; font-weight: bold; fill: #ffffff; }
    .at { font-size: 19px; fill: #1d2733; }
    .orig { font-size: 16px; font-style: italic; fill: #5f6b7a; }
    .ref { font-size: 16px; font-weight: bold; fill: #2f6b3a; }
    .redis { font-size: 16px; font-weight: bold; fill: #b42318; }
    .uq { font-size: 16px; font-weight: bold; fill: #6b3fa0; }
    .idx { fill: #fdf3d7; }
    .idxsep { stroke: #c9a227; stroke-width: 1.5; }
    .idxtit { font-size: 16px; font-weight: bold; fill: #7a5d00; }
    .idxtx { font-size: 18px; fill: #1d2733; }
    .emb { fill: #e3eefb; stroke: #5b84c4; stroke-width: 1.5; }
    .embcab { fill: #c9dcf5; }
    .embtit { font-size: 17px; font-weight: bold; fill: #1f3d6b; }
    .nota { font-size: 16px; font-style: italic; fill: #4a5563; }
    .vista { fill: #f7f7f7; stroke: #2b4c7e; stroke-width: 2; stroke-dasharray: 8 5; }
    .vistacab { fill: #dfe6ef; }
    .vistatit { font-size: 19px; font-weight: bold; fill: #1f3d6b; }
    .vtx { font-size: 17px; fill: #1d2733; }
    .flecha { fill: none; stroke: #2f6b3a; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#flecha); }
    .union { fill: none; stroke: #2f6b3a; stroke-width: 2; stroke-dasharray: 7 5; }
    .nudo { fill: #2f6b3a; }
    .titulo { font-size: 28px; font-weight: bold; fill: #1d2733; }
    .sub { font-size: 18px; fill: #4a5563; }
    .leyenda { fill: #ffffff; stroke: #9aa5b1; stroke-width: 1.5; }
    .leytit { font-size: 19px; font-weight: bold; fill: #1d2733; }
    .leytx { font-size: 17px; fill: #1d2733; }
  </style>
  <rect class="fondo" x="0" y="0" width="1340" height="1318"/>
  <text class="titulo" x="20" y="42">Modelo físico en MongoDB</text>
  <text class="sub" x="20" y="72">Base farmared: colecciones, campos con su tipo, referencias e índices. El stock por lote no está aquí: vive en Redis.</text>

  <!-- clientes -->
  <rect class="caja" x="20" y="100" width="400" height="326" rx="6"/>
  <path class="cab" d="M 26 100 h 388 a 6 6 0 0 1 6 6 v 32 h -400 v -32 a 6 6 0 0 1 6 -6 z"/>
  <text class="orig" x="408" y="170" text-anchor="end">id_cliente</text>
  <text class="at" x="32" y="170">_id: str</text>
  <text class="at" x="32" y="196">nombre, apellido: str</text>
  <text class="at" x="32" y="222">dni: str</text>
  <text class="at" x="32" y="248">email, telefono: str</text>
  <text class="at" x="32" y="274">ciudad, provincia: str</text>
  <text class="at" x="32" y="300">obra_social: str</text>
  <text class="at" x="32" y="326">nro_afiliado: str | null</text>
  <text class="at" x="32" y="352">activo: bool</text>
  <path class="idx" d="M 20 370 H 420 V 420 a 6 6 0 0 1 -6 6 H 26 a 6 6 0 0 1 -6 -6 z"/>
  <line class="idxsep" x1="20" y1="370" x2="420" y2="370"/>
  <text class="idxtit" x="32" y="392">Índices</text>
  <text class="uq" x="408" y="418" text-anchor="end">único</text>
  <text class="idxtx" x="32" y="418">{ dni: 1 }</text>
  <rect class="borde" x="20" y="100" width="400" height="326" rx="6"/>
  <text class="tit" x="32" y="127">clientes</text>

  <!-- recetas -->
  <rect class="caja" x="20" y="496" width="400" height="404" rx="6"/>
  <path class="cab" d="M 26 496 h 388 a 6 6 0 0 1 6 6 v 32 h -400 v -32 a 6 6 0 0 1 6 -6 z"/>
  <text class="orig" x="408" y="566" text-anchor="end">id_receta</text>
  <text class="at" x="32" y="566">_id: str</text>
  <text class="ref" x="408" y="592" text-anchor="end">→ clientes</text>
  <text class="at" x="32" y="592">id_cliente: str</text>
  <text class="at" x="32" y="618">medico, matricula_medico: str</text>
  <text class="at" x="32" y="644">fecha_emision: datetime</text>
  <text class="at" x="32" y="670">tipo: str</text>
  <text class="at" x="32" y="696">dispensas_autorizadas: int</text>
  <text class="at" x="32" y="722">dispensas_realizadas: int</text>
  <text class="at" x="32" y="748">proxima_dispensa: datetime | null</text>
  <text class="at" x="32" y="774">estado: str</text>
  <path class="idx" d="M 20 792 H 420 V 894 a 6 6 0 0 1 -6 6 H 26 a 6 6 0 0 1 -6 -6 z"/>
  <line class="idxsep" x1="20" y1="792" x2="420" y2="792"/>
  <text class="idxtit" x="32" y="814">Índices</text>
  <text class="idxtx" x="32" y="840">{ id_cliente: 1, fecha_emision: 1 }</text>
  <text class="idxtx" x="32" y="866">{ tipo: 1, estado: 1,</text>
  <text class="idxtx" x="54" y="892">proxima_dispensa: 1 }</text>
  <rect class="borde" x="20" y="496" width="400" height="404" rx="6"/>
  <text class="tit" x="32" y="523">recetas</text>

  <!-- contadores -->
  <rect class="caja" x="20" y="956" width="400" height="180" rx="6"/>
  <path class="cab" d="M 26 956 h 388 a 6 6 0 0 1 6 6 v 32 h -400 v -32 a 6 6 0 0 1 6 -6 z"/>
  <text class="orig" x="408" y="1026" text-anchor="end">nombre de la secuencia</text>
  <text class="at" x="32" y="1026">_id: str</text>
  <text class="at" x="32" y="1052">ultimo: int</text>
  <text class="nota" x="32" y="1074">Un documento por secuencia: clientes, ventas</text>
  <text class="nota" x="32" y="1096">y detalle_ventas. Se incrementa con $inc</text>
  <text class="nota" x="32" y="1118">dentro de la transacción.</text>
  <rect class="borde" x="20" y="956" width="400" height="180" rx="6"/>
  <text class="tit" x="32" y="983">contadores</text>

  <!-- ventas -->
  <rect class="caja" x="490" y="100" width="410" height="726" rx="6"/>
  <path class="cab" d="M 496 100 h 398 a 6 6 0 0 1 6 6 v 32 h -410 v -32 a 6 6 0 0 1 6 -6 z"/>
  <text class="orig" x="888" y="170" text-anchor="end">id_venta</text>
  <text class="at" x="502" y="170">_id: str</text>
  <text class="ref" x="888" y="196" text-anchor="end">→ clientes</text>
  <text class="at" x="502" y="196">id_cliente: str</text>
  <text class="ref" x="888" y="222" text-anchor="end">→ farmaceuticos</text>
  <text class="at" x="502" y="222">id_farmaceutico: str</text>
  <text class="ref" x="888" y="248" text-anchor="end">→ recetas</text>
  <text class="at" x="502" y="248">id_receta: str | null</text>
  <text class="at" x="502" y="274">fecha: datetime</text>
  <text class="at" x="502" y="300">tipo, medio_pago, estado: str</text>
  <text class="at" x="502" y="326">total: int</text>
  <text class="at" x="502" y="352">stock_descontado: bool</text>
  <rect class="emb" x="508" y="374" width="374" height="170" rx="5"/>
  <path class="embcab" d="M 513 374.75 h 364 a 4.25 4.25 0 0 1 4.25 4.25 v 23.75 h -372.5 v -23.75 a 4.25 4.25 0 0 1 4.25 -4.25 z"/>
  <text class="embtit" x="520" y="395">items: array embebido</text>
  <text class="at" x="520" y="430">id_detalle: str</text>
  <text class="ref" x="870" y="456" text-anchor="end">→ productos</text>
  <text class="at" x="520" y="456">id_producto: str</text>
  <text class="at" x="520" y="482">cantidad: int</text>
  <text class="at" x="520" y="508">precio_unit: int</text>
  <text class="nota" x="520" y="530">Ordenados por id_detalle.</text>
  <rect class="emb" x="508" y="558" width="374" height="144" rx="5"/>
  <path class="embcab" d="M 513 558.75 h 364 a 4.25 4.25 0 0 1 4.25 4.25 v 23.75 h -372.5 v -23.75 a 4.25 4.25 0 0 1 4.25 -4.25 z"/>
  <text class="embtit" x="520" y="579">consumos: array embebido</text>
  <text class="redis" x="870" y="614" text-anchor="end">→ lote en Redis</text>
  <text class="at" x="520" y="614">id_lote: str</text>
  <text class="ref" x="870" y="640" text-anchor="end">→ productos</text>
  <text class="at" x="520" y="640">id_producto: str</text>
  <text class="at" x="520" y="666">unidades: int</text>
  <text class="nota" x="520" y="688">Lo agrega q15 al descontar el stock.</text>
  <path class="idx" d="M 490 718 H 900 V 820 a 6 6 0 0 1 -6 6 H 496 a 6 6 0 0 1 -6 -6 z"/>
  <line class="idxsep" x1="490" y1="718" x2="900" y2="718"/>
  <text class="idxtit" x="502" y="740">Índices</text>
  <text class="idxtx" x="502" y="766">{ id_cliente: 1, fecha: 1 }</text>
  <text class="idxtx" x="502" y="792">{ id_farmaceutico: 1, fecha: 1 }</text>
  <text class="idxtx" x="502" y="818">{ fecha: 1 }</text>
  <rect class="borde" x="490" y="100" width="410" height="726" rx="6"/>
  <text class="tit" x="502" y="127">ventas</text>

  <!-- vista -->
  <rect class="vista" x="490" y="872" width="410" height="138" rx="6"/>
  <path class="vistacab" d="M 497 873 h 396 a 6 6 0 0 1 6 6 v 30 h -408 v -30 a 6 6 0 0 1 6 -6 z"/>
  <text class="vistatit" x="502" y="898">ingresos_mes_actual (vista)</text>
  <text class="vtx" x="502" y="940">Vista sobre ventas que q11 recrea en cada uso:</text>
  <text class="vtx" x="502" y="966">ventas 'Completada' del mes actual ($$NOW),</text>
  <text class="vtx" x="502" y="992">agrupadas por farmacéutico con sus ingresos.</text>

  <!-- Leyenda -->
  <rect class="leyenda" x="490" y="1056" width="410" height="232" rx="6"/>
  <text class="leytit" x="506" y="1084">Referencias</text>
  <line class="flecha" x1="506" y1="1107" x2="556" y2="1107"/>
  <text class="leytx" x="570" y="1112">referencia por id, la valida la aplicación</text>
  <rect class="emb" x="506" y="1125" width="50" height="18" rx="3"/>
  <text class="leytx" x="570" y="1140">array embebido en el documento</text>
  <rect class="idx" x="506" y="1153" width="50" height="18" rx="3" stroke="#c9a227" stroke-width="1.5"/>
  <text class="leytx" x="570" y="1168">índices que crea la carga</text>
  <text class="leytx" x="506" y="1202">Todas las colecciones tienen además el índice</text>
  <text class="leytx" x="506" y="1224">único de _id.</text>
  <text class="leytx" x="506" y="1246">datetime: la fecha, a medianoche.</text>
  <text class="leytx" x="506" y="1268">null: el valor vacío del CSV.</text>

  <!-- farmaceuticos -->
  <rect class="caja" x="970" y="100" width="350" height="274" rx="6"/>
  <path class="cab" d="M 976 100 h 338 a 6 6 0 0 1 6 6 v 32 h -350 v -32 a 6 6 0 0 1 6 -6 z"/>
  <text class="orig" x="1308" y="170" text-anchor="end">id_farmaceutico</text>
  <text class="at" x="982" y="170">_id: str</text>
  <text class="at" x="982" y="196">nombre, apellido: str</text>
  <text class="at" x="982" y="222">matricula: str</text>
  <text class="at" x="982" y="248">cargo: str</text>
  <text class="ref" x="1308" y="274" text-anchor="end">→ sucursales</text>
  <text class="at" x="982" y="274">id_sucursal: str</text>
  <text class="at" x="982" y="300">activo: bool</text>
  <path class="idx" d="M 970 318 H 1320 V 368 a 6 6 0 0 1 -6 6 H 976 a 6 6 0 0 1 -6 -6 z"/>
  <line class="idxsep" x1="970" y1="318" x2="1320" y2="318"/>
  <text class="idxtit" x="982" y="340">Índices</text>
  <text class="uq" x="1308" y="366" text-anchor="end">único</text>
  <text class="idxtx" x="982" y="366">{ matricula: 1 }</text>
  <rect class="borde" x="970" y="100" width="350" height="274" rx="6"/>
  <text class="tit" x="982" y="127">farmaceuticos</text>

  <!-- sucursales -->
  <rect class="caja" x="970" y="420" width="350" height="218" rx="6"/>
  <path class="cab" d="M 976 420 h 338 a 6 6 0 0 1 6 6 v 32 h -350 v -32 a 6 6 0 0 1 6 -6 z"/>
  <text class="orig" x="1308" y="490" text-anchor="end">id_sucursal</text>
  <text class="at" x="982" y="490">_id: str</text>
  <text class="at" x="982" y="516">nombre, tipo: str</text>
  <text class="at" x="982" y="542">direccion: str</text>
  <text class="at" x="982" y="568">ciudad, provincia: str</text>
  <text class="at" x="982" y="594">telefono: str</text>
  <text class="at" x="982" y="620">activo: bool</text>
  <rect class="borde" x="970" y="420" width="350" height="218" rx="6"/>
  <text class="tit" x="982" y="447">sucursales</text>

  <!-- productos -->
  <rect class="caja" x="970" y="684" width="350" height="244" rx="6"/>
  <path class="cab" d="M 976 684 h 338 a 6 6 0 0 1 6 6 v 32 h -350 v -32 a 6 6 0 0 1 6 -6 z"/>
  <text class="orig" x="1308" y="754" text-anchor="end">id_producto</text>
  <text class="at" x="982" y="754">_id: str</text>
  <text class="at" x="982" y="780">nombre, principio_activo: str</text>
  <text class="at" x="982" y="806">categoria, presentacion: str</text>
  <text class="at" x="982" y="832">condicion_venta: str</text>
  <text class="at" x="982" y="858">precio_unit: int</text>
  <text class="ref" x="1308" y="884" text-anchor="end">→ proveedores</text>
  <text class="at" x="982" y="884">id_proveedor: str</text>
  <text class="at" x="982" y="910">activo: bool</text>
  <rect class="borde" x="970" y="684" width="350" height="244" rx="6"/>
  <text class="tit" x="982" y="711">productos</text>

  <!-- proveedores -->
  <rect class="caja" x="970" y="974" width="350" height="248" rx="6"/>
  <path class="cab" d="M 976 974 h 338 a 6 6 0 0 1 6 6 v 32 h -350 v -32 a 6 6 0 0 1 6 -6 z"/>
  <text class="orig" x="1308" y="1044" text-anchor="end">id_proveedor</text>
  <text class="at" x="982" y="1044">_id: str</text>
  <text class="at" x="982" y="1070">razon_social, cuit: str</text>
  <text class="at" x="982" y="1096">tipo: str</text>
  <text class="at" x="982" y="1122">ciudad, provincia, telefono: str</text>
  <text class="at" x="982" y="1148">activo: bool</text>
  <path class="idx" d="M 970 1166 H 1320 V 1216 a 6 6 0 0 1 -6 6 H 976 a 6 6 0 0 1 -6 -6 z"/>
  <line class="idxsep" x1="970" y1="1166" x2="1320" y2="1166"/>
  <text class="idxtit" x="982" y="1188">Índices</text>
  <text class="uq" x="1308" y="1214" text-anchor="end">único</text>
  <text class="idxtx" x="982" y="1214">{ cuit: 1 }</text>
  <rect class="borde" x="970" y="974" width="350" height="248" rx="6"/>
  <text class="tit" x="982" y="1001">proveedores</text>

  <!-- Referencias entre colecciones -->
  <line class="flecha" x1="220" y1="496" x2="220" y2="428"/>
  <line class="flecha" x1="490" y1="190" x2="422" y2="190"/>
  <path class="flecha" d="M 490 242 H 455 V 560 H 422"/>
  <line class="flecha" x1="900" y1="216" x2="968" y2="216"/>
  <path class="flecha" d="M 882 450 H 935 V 748 H 968"/>
  <path class="union" d="M 882 634 H 935"/>
  <circle class="nudo" cx="935" cy="634" r="4"/>
  <line class="flecha" x1="1145" y1="374" x2="1145" y2="418"/>
  <line class="flecha" x1="1145" y1="928" x2="1145" y2="972"/>
</svg>
